[polling]
interval_seconds = 60
timezone = "America/New_York"

[telegram]
parse_mode = "HTML"
disable_web_page_preview = false

[x]
exclude_replies = true
default_include_reposts = true
max_results = 10

[classifier]
provider = "none"
# For a local Hermes-style endpoint:
# provider = "http_json"
# http_json_url = "http://127.0.0.1:8787/classify"
# fallback_provider = "xai"
# model = "grok-4.3"

[state]
path = "data/twitter-tg-notifs.sqlite3"

