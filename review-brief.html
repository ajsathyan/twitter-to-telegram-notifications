<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review Brief</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #111315;
      --muted: #59616b;
      --line: #dbe1e7;
      --soft: #f4f6f8;
      --green: #247a4d;
      --amber: #9a6500;
      --red: #ad3434;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #fff;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { max-width: 1180px; margin: 0 auto; padding: 42px 28px; }
    header { display: flex; justify-content: space-between; gap: 24px; align-items: flex-start; }
    h1 { margin: 6px 0 0; font-size: 36px; line-height: 42px; letter-spacing: 0; }
    h2 { margin: 0; font-size: 20px; line-height: 28px; }
    h3 { margin: 0; font-size: 16px; line-height: 22px; }
    p { color: var(--muted); font-size: 15px; line-height: 22px; }
    .eyebrow {
      color: #717983;
      font-size: 12px;
      font-weight: 850;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 0 10px;
      background: var(--soft);
      color: #3f464d;
      font-size: 13px;
      font-weight: 800;
    }
    .status { color: var(--green); }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 22px; margin-top: 28px; }
    .section {
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
    }
    .section-head {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
      min-height: 58px;
      padding: 14px 16px;
      background: var(--soft);
      border-bottom: 1px solid var(--line);
    }
    .card {
      padding: 16px;
      border-bottom: 1px solid #edf0f3;
      cursor: pointer;
    }
    .card:last-child { border-bottom: 0; }
    .card.selected { background: #fff7e8; }
    .meta { display: flex; gap: 8px; flex-wrap: wrap; margin: 9px 0 0; }
    .tag {
      border-radius: 999px;
      background: var(--soft);
      color: #3f464d;
      font-size: 12px;
      font-weight: 850;
      padding: 4px 8px;
    }
    .tag.passed, .tag.done { color: var(--green); }
    .tag.partial, .tag.ready { color: var(--amber); }
    .tag.failed, .tag.blocked { color: var(--red); }
    .details { padding: 18px; }
    .details dl { display: grid; grid-template-columns: 150px 1fr; gap: 12px 16px; margin: 0; }
    dt { color: #717983; font-size: 13px; font-weight: 850; }
    dd { margin: 0; font-size: 14px; line-height: 21px; }
    .links { display: flex; flex-wrap: wrap; gap: 6px; }
    button {
      border: 0;
      border-radius: 7px;
      background: var(--ink);
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 850;
      min-height: 34px;
      padding: 0 11px;
    }
    .side { display: flex; flex-direction: column; gap: 14px; }
    .list { padding: 12px 16px 16px; }
    .row { padding: 10px 0; border-bottom: 1px solid #edf0f3; }
    .row:last-child { border-bottom: 0; }
    .row b { display: block; font-size: 14px; line-height: 20px; }
    .row span { color: var(--muted); font-size: 13px; line-height: 19px; }
    .search {
      width: 100%;
      height: 38px;
      border: 1px solid #c8d0d8;
      border-radius: 7px;
      padding: 0 10px;
      font: inherit;
    }
    .empty { padding: 18px; color: var(--muted); }
    @media (max-width: 920px) {
      header, .layout { grid-template-columns: 1fr; display: block; }
      .layout { display: flex; flex-direction: column; }
      main { padding: 28px 16px; }
      .details dl { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <div class="eyebrow">Gauntlet Review Brief</div>
        <h1 id="title">Review Brief</h1>
        <p id="summary"></p>
      </div>
      <div class="pill"><span id="status"></span></div>
    </header>

    <div class="layout">
      <section class="section">
        <div class="section-head">
          <div>
            <div class="eyebrow">Review</div>
            <h2>Current attention queue</h2>
          </div>
          <input id="search" class="search" placeholder="Filter by handle, title, role, or proof">
        </div>
        <div id="cards"></div>
      </section>

      <aside class="side">
        <section class="section">
          <div class="section-head">
            <div>
              <div class="eyebrow">Details</div>
              <h2 id="details-title">Select an item</h2>
            </div>
            <button id="copy-action" type="button">Copy next action</button>
          </div>
          <div id="details" class="details"></div>
        </section>

        <section class="section">
          <div class="section-head">
            <div>
              <div class="eyebrow">Proof</div>
              <h2>Verification</h2>
            </div>
          </div>
          <div id="proof" class="list"></div>
        </section>

        <section class="section">
          <div class="section-head">
            <div>
              <div class="eyebrow">Changelog</div>
              <h2>Change units</h2>
            </div>
          </div>
          <div id="change-units" class="list"></div>
        </section>
      </aside>
    </div>
  </main>

  <script>
    const embeddedData = JSON.parse(document.getElementById("embedded-data").textContent);
    let data = embeddedData;
    let selectedId = null;

    const byId = (id) => document.getElementById(id);
    const text = (value) => String(value ?? "");
    const cls = (value) => text(value).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

    async function loadData() {
      try {
        const response = await fetch("review-brief-data.json", { cache: "no-store" });
        if (response.ok) data = await response.json();
      } catch {
        data = embeddedData;
      }
      selectedId = data.reviewItems[0]?.id || null;
      render();
    }

    function render() {
      byId("title").textContent = data.brief.title;
      byId("summary").textContent = data.brief.summary;
      byId("status").textContent = `${data.brief.mode}: ${data.brief.status} • ${data.generatedAt}`;
      renderCards();
      renderDetails();
      renderRows("proof", data.proof, (item) => `${item.status}: ${item.result}`);
      renderRows("change-units", data.changeUnits, (item) => item.reason);
    }

    function renderCards() {
      const query = byId("search").value.trim().toLowerCase();
      const root = byId("cards");
      root.replaceChildren();
      const items = data.reviewItems.filter((item) => {
        const haystack = [item.id, item.title, item.role, item.priority, item.proofStatus, item.reviewState].join(" ").toLowerCase();
        return !query || haystack.includes(query);
      });
      if (!items.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No matching review items.";
        root.append(empty);
        return;
      }
      for (const item of items) {
        const card = document.createElement("article");
        card.className = `card ${item.id === selectedId ? "selected" : ""}`;
        card.addEventListener("click", () => {
          selectedId = item.id;
          renderCards();
          renderDetails();
        });

        const title = document.createElement("h3");
        title.textContent = `${item.id} ${item.title}`;
        const why = document.createElement("p");
        why.textContent = item.why;
        const meta = document.createElement("div");
        meta.className = "meta";
        for (const value of [item.priority, item.role, item.reviewState, item.proofStatus, item.confidence]) {
          const tag = document.createElement("span");
          tag.className = `tag ${cls(value)}`;
          tag.textContent = value;
          meta.append(tag);
        }
        card.append(title, why, meta);
        root.append(card);
      }
    }

    function renderDetails() {
      const item = data.reviewItems.find((candidate) => candidate.id === selectedId);
      const root = byId("details");
      root.replaceChildren();
      if (!item) {
        byId("details-title").textContent = "Select an item";
        return;
      }
      byId("details-title").textContent = item.id;
      const dl = document.createElement("dl");
      for (const [label, value] of [
        ["Title", item.title],
        ["Priority", item.priority],
        ["Role", item.role],
        ["Review state", item.reviewState],
        ["Proof", item.proofStatus],
        ["Decision needed", item.decisionNeeded],
        ["Agent can do next", item.agentNext],
        ["Links", item.links]
      ]) {
        const dt = document.createElement("dt");
        dt.textContent = label;
        const dd = document.createElement("dd");
        if (Array.isArray(value)) {
          const links = document.createElement("div");
          links.className = "links";
          for (const handle of value) {
            const tag = document.createElement("span");
            tag.className = "tag";
            tag.textContent = handle;
            links.append(tag);
          }
          dd.append(links);
        } else {
          dd.textContent = value;
        }
        dl.append(dt, dd);
      }
      root.append(dl);
    }

    function renderRows(rootId, items, secondary) {
      const root = byId(rootId);
      root.replaceChildren();
      for (const item of items) {
        const row = document.createElement("div");
        row.className = "row";
        const title = document.createElement("b");
        title.textContent = `${item.id} ${item.title}`;
        const detail = document.createElement("span");
        detail.textContent = secondary(item);
        row.append(title, detail);
        root.append(row);
      }
    }

    byId("search").addEventListener("input", renderCards);
    byId("copy-action").addEventListener("click", async () => {
      const item = data.reviewItems.find((candidate) => candidate.id === selectedId);
      if (!item) return;
      const payload = `Review brief: review-brief.html (${data.generatedAt})\nHandle: ${item.id}\nNext action: ${item.agentNext}\nLinked evidence: ${item.links.join(", ")}`;
      await navigator.clipboard.writeText(payload);
    });
    loadData();
  </script>
